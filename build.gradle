import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import javax.imageio.ImageIO

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:${forgegradle_version}"
        classpath "org.spongepowered:mixingradle:${mixingradle_version}"
        classpath "org.parchmentmc:librarian:${librarian_version}"
    }
}


plugins {
    id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'net.averageanime.createfood'
archivesBaseName = "create-food-${minecraft_version}"

jarJar.enable()
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg') // Currently, this location cannot be changed from the default.

    runs {
        client {
            workingDirectory project.file('run')
            arg '-mixin.config=createfood.mixins.json'
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'createfood'
            mods {
                createfood {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            arg '-mixin.config=createfood.mixins.json'
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'createfood'
            mods {
                createfood {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            args '--mod', 'createfood',
                    '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing-mod', 'create',
                    '--existing-mod', 'farmersdelight'
            mods {
                createfood {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven {
        name "Tterrag maven"
        url "https://maven.tterrag.com/"
    }
    maven {
        name "Theillusivec4 Maven"
        url "https://maven.theillusivec4.top/"
    }
    maven {
        name "Curse Maven"
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "squiddev"
        url = "https://squiddev.cc/maven/"
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    compileOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")) {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    // Registrate — compileOnly; we no longer reference it at runtime
    compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    compileOnly(fg.deobf("curse.maven:farmers-delight-398521:5051242")) {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    compileOnly(fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.136"))

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // 2. Provide the Forge implementation at runtime and bundle it via JarJar
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    doLast {
        def slurper = new JsonSlurper()
        def jsonTotal = 0L, jsonSaved = 0L
        def pngTotal = 0L, pngSaved = 0L
        destinationDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def name = f.name
            if (name.endsWith('.json') || name.endsWith('.mcmeta')) {
                def before = f.length()
                try {
                    def parsed = slurper.parse(f, 'UTF-8')
                    if (parsed instanceof Map) {
                        parsed.remove('credit')
                        parsed.remove('format_version')
                        parsed.remove('groups')
                        parsed.get('elements')?.each { el ->
                            if (el?.rotation?.angle == 0) {
                                el.remove('rotation')
                            }
                        }
                    }
                    f.setText(JsonOutput.toJson(parsed), 'UTF-8')
                    jsonTotal += before
                    jsonSaved += before - f.length()
                } catch (Exception ignored) { }
            } else if (name.endsWith('.png')) {
                def before = f.length()
                pngTotal += before
                try {
                    def img = ImageIO.read(f)
                    if (img == null) return
                    def tmp = new File(f.parentFile, f.name + '.tmp')
                    if (!ImageIO.write(img, 'png', tmp)) { tmp.delete(); return }
                    if (tmp.length() > 0 && tmp.length() < before) {
                        pngSaved += before - tmp.length()
                        f.delete(); tmp.renameTo(f)
                    } else { tmp.delete() }
                } catch (Exception ignored) { }
            }
        }
        if (jsonTotal > 0) logger.lifecycle("JSON minify: ${jsonSaved}/${jsonTotal} bytes saved (${(int)(jsonSaved * 100 / jsonTotal)}%)")
        if (pngTotal > 0) logger.lifecycle("PNG re-encode: ${pngSaved}/${pngTotal} bytes saved (${(int)(pngSaved * 100 / pngTotal)}%)")
    }
}

mixin {
    add sourceSets.main, 'createfood.refmap.json'
    config 'createfood.mixins.json'

    debug.verbose = true
    debug.export = true
}


void processJar(Jar jarTask) {
    jarTask.configure {
        from "LICENSE"
        exclude ".cache"
        exclude "assets/createfood/lang/unfinished"
        exclude "assets/createfood/lang/default"

        manifest {
            attributes([
                    "Specification-Title"     : "createfood",
                    "Specification-Vendor"    : "average_anime",
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : "average_anime",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'MixinConfigs': 'createfood.mixins.json'
            ])
        }
    }
}

jar.finalizedBy('reobfJar')
jar.setArchiveClassifier('slim')
tasks.jarJar.setArchiveClassifier('')
tasks.jarJar.finalizedBy('reobfJarJar')

processJar(jar)
processJar(tasks.jarJar)

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}