plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def commonResources = rootProject.project(':common').projectDir.toPath()
        .resolve('src/main/resources').toFile().absolutePath

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // Lets a dev-time addon that is still a source tree be picked up without building a jar.
            systemProperty 'createfood.addonRoots',
                    providers.systemProperty('createfood.addonRoots').getOrElse('')
        }
        data {
            data()
            // Generated resources must depend only on committed source, so these are empty unless an
            // addon root is named explicitly. An addon supplies both its spec and its hand-authored
            // recipes, and the second is what RecipeGenerator mirrors into shaped variants.
            systemProperty 'createfood.addonRoots',
                    providers.systemProperty('createfood.addonRoots').getOrElse('')
            systemProperty 'createfood.recipeSourceRoots',
                    providers.systemProperty('createfood.recipeSourceRoots').getOrElse('')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('../common/src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('../common/src/main/resources').absolutePath
            // ExistingFileHelper treats each --existing as one pack root and does not descend
            // into resourcepacks/, so the foreign textures and models that moved into the
            // built-in packs would drop out of model and texture validation. Listed from the
            // filesystem so adding a pack needs no edit here.
            file('../common/src/main/resources/resourcepacks').listFiles()
                    ?.findAll { it.directory }?.sort { it.name }?.each {
                programArguments.addAll '--existing', it.absolutePath
            }
        }
        server {
            server()
            setGameDirectory(file('server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
        exclusiveContent {
            forRepository {
                maven { url = "https://api.modrinth.com/maven" }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {

        compileOnly "curse.maven:farmers-delight-398521:8672744"

        // Jade soft dependency: build-time only, discovered via @WailaPlugin annotation scan at runtime.
        // No mods.toml dependency entry needed. Bump the version string as Jade updates.
        compileOnly "maven.modrinth:jade:15.10.5+neoforge"

    }
}

sourceSets.main.resources { srcDir '../common/src/generated/resources' }

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

