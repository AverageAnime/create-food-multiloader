import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import javax.imageio.ImageIO

plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)

    doLast {
        def slurper = new JsonSlurper()
        def jsonTotal = 0L, jsonSaved = 0L
        def pngTotal = 0L, pngSaved = 0L
        destinationDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def name = f.name
            if (name.endsWith('.json') || name.endsWith('.mcmeta')) {
                def before = f.length()
                try {
                    def parsed = slurper.parse(f, 'UTF-8')
                    // Strip editor-only fields
                    if (parsed instanceof Map) {
                        parsed.remove('credit')
                        parsed.remove('format_version')
                        parsed.remove('groups')
                        // Remove zero-angle rotations from elements
                        parsed.get('elements')?.each { el ->
                            if (el?.rotation?.angle == 0) {
                                el.remove('rotation')
                            }
                        }
                    }
                    def compact = JsonOutput.toJson(parsed)
                    f.setText(compact, 'UTF-8')
                    jsonTotal += before
                    jsonSaved += before - f.length()
                } catch (Exception ignored) { }
            } else if (name.endsWith('.png')) {
                def before = f.length()
                pngTotal += before
                try {
                    def img = ImageIO.read(f)
                    if (img == null) return
                    def tmp = new File(f.parentFile, f.name + '.tmp')
                    if (!ImageIO.write(img, 'png', tmp)) {
                        tmp.delete()
                        return
                    }
                    if (tmp.length() > 0 && tmp.length() < before) {
                        pngSaved += before - tmp.length()
                        f.delete()
                        tmp.renameTo(f)
                    } else {
                        tmp.delete()
                    }
                } catch (Exception ignored) { }
            }
        }
        if (jsonTotal > 0) {
            logger.lifecycle("JSON minify: ${jsonSaved} / ${jsonTotal} bytes saved (${(int)(jsonSaved * 100 / jsonTotal)}%)")
        }
        if (pngTotal > 0) {
            logger.lifecycle("PNG re-encode: ${pngSaved} / ${pngTotal} bytes saved (${(int)(pngSaved * 100 / pngTotal)}%)")
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            def name=base.archivesName.get()
            artifactId name.substring(0,name.lastIndexOf('-'))
            artifact jar
            artifact sourcesJar
        }
    }
}

def void register(String s, Class<MavenPublication> mavenPublicationClass, Closure<MavenArtifact> mavenArtifactClosure) {}